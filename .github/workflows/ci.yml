name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            server/package-lock.json
            poc/ilink-gateway/package-lock.json

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Build server
        working-directory: server
        run: npm run build

      - name: Test server
        working-directory: server
        run: npm test

      - name: Audit server production dependencies
        working-directory: server
        run: npm audit --omit=dev

      - name: Install app dependencies
        working-directory: app
        run: npm ci

      - name: Install Gateway dependencies
        working-directory: poc/ilink-gateway
        run: npm ci

      - name: Build and test Gateway
        working-directory: poc/ilink-gateway
        run: npm run build && npm test

      - name: Build H5 app
        working-directory: app
        run: npm run build:h5

      - name: Install H5 browser
        working-directory: app
        run: npx playwright install --with-deps chromium

      - name: Test H5 runtime
        working-directory: app
        run: npm run test:e2e

      - name: Audit app production dependencies
        working-directory: app
        run: npm audit --omit=dev
