server {
    listen 80;
    server_name your-domain.example;
    # 先用 HTTP，certbot 会自动改成 HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name your-domain.example;

    # certbot 自动填充证书路径
    ssl_certificate     /path/to/fullchain.pem;
    ssl_certificate_key /path/to/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    # 仅在已由本 server 块终止 TLS 的 HTTPS 响应上声明 HSTS；本地 HTTP 不设置。
    add_header Strict-Transport-Security "max-age=31536000" always;

    # 上传文件大小限制
    client_max_body_size 20m;

    # 性能优化：同机全局 nginx.conf 的 gzip_types 是关掉的，只压 text/html，这里单独给这个站点开
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript application/x-javascript text/javascript text/xml application/xml application/xml+rss image/svg+xml font/woff2;

    # 反向代理到 Fastify
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}
